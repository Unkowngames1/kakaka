<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jarvis HUD</title>
  <style>
    :root {
      --bg-1: #02080d;
      --bg-2: #071922;
      --panel: rgba(12, 24, 31, 0.76);
      --panel-strong: rgba(16, 33, 43, 0.9);
      --line: rgba(111, 224, 255, 0.28);
      --cyan: #75efff;
      --cyan-strong: #7ef9ff;
      --cyan-soft: rgba(117, 239, 255, 0.14);
      --text: #dffcff;
      --muted: #8ab7c5;
      --green: #8bffb3;
      --white: #edfdfd;
      --shadow: rgba(117, 239, 255, 0.2);
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background:
        radial-gradient(circle at center, rgba(20, 58, 72, 0.55), transparent 32%),
        linear-gradient(180deg, var(--bg-1), var(--bg-2));
      color: var(--text);
      overflow: hidden;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .hud {
      position: relative;
      width: 100vw;
      height: 100vh;
      background: rgba(3, 10, 15, 0.92);
      border: 1px solid var(--line);
      box-shadow:
        inset 0 0 30px rgba(117, 239, 255, 0.14),
        0 0 60px rgba(13, 24, 32, 0.9);
      overflow: hidden;
    }

    .hud::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
      background-size: 24px 24px;
      opacity: 0.45;
      pointer-events: none;
    }

    .scanlines {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to bottom,
        transparent 0%,
        rgba(117, 239, 255, 0.02) 50%,
        transparent 100%
      );
      background-size: 100% 6px;
      opacity: 0.5;
      pointer-events: none;
    }

    .topbar,
    .bottombar {
      position: absolute;
      left: 0;
      width: 100%;
      height: 72px;
      padding: 0 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      font-size: 11px;
      color: var(--muted);
      border-bottom: 1px solid var(--line);
      background: rgba(7, 17, 23, 0.24);
      z-index: 2;
    }

    .topbar {
      top: 0;
    }

    .bottombar {
      bottom: 0;
      border-top: 1px solid var(--line);
      border-bottom: none;
    }

    .brand {
      font-weight: 700;
      color: var(--cyan);
      text-shadow: 0 0 18px rgba(117, 239, 255, 0.6);
    }

    .status {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .status .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 15px var(--green);
      display: inline-block;
    }

    .left-panel,
    .right-panel {
      position: absolute;
      top: 110px;
      bottom: 110px;
      width: 220px;
      display: flex;
      flex-direction: column;
      gap: 18px;
      z-index: 2;
    }

    .left-panel {
      left: 24px;
    }

    .right-panel {
      right: 24px;
    }

    .module,
    .card {
      background: rgba(9, 21, 27, 0.72);
      border: 1px solid var(--line);
      backdrop-filter: blur(6px);
      box-shadow:
        inset 0 0 18px rgba(117, 239, 255, 0.06),
        0 0 18px rgba(117, 239, 255, 0.08);
      padding: 16px 18px;
    }

    .module {
      color: var(--text);
      letter-spacing: 0.18em;
      text-transform: uppercase;
      font-size: 11px;
      transition: 0.2s ease;
    }

    .module.active {
      background: rgba(117, 239, 255, 0.08);
      border-color: rgba(117, 239, 255, 0.8);
      box-shadow:
        inset 0 0 18px rgba(117, 239, 255, 0.12),
        0 0 25px rgba(117, 239, 255, 0.22);
    }

    .card {
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-height: 110px;
    }

    .card .label {
      color: var(--muted);
      font-size: 10px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }

    .card .value {
      font-size: 22px;
      color: var(--white);
      text-shadow: 0 0 12px rgba(117,239,255,0.4);
    }

    .main {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: min(52vw, 740px);
      height: min(60vh, 620px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 2;
    }

    .core-ring {
      width: min(34vw, 360px);
      height: min(34vw, 360px);
      min-width: 220px;
      min-height: 220px;
      border-radius: 50%;
      position: relative;
      display: grid;
      place-items: center;
      border: 1px solid rgba(117, 239, 255, 0.65);
      background: radial-gradient(circle, rgba(117, 239, 255, 0.12), rgba(117, 239, 255, 0.02) 45%, transparent 60%);
      box-shadow:
        inset 0 0 40px rgba(117, 239, 255, 0.08),
        0 0 28px rgba(117, 239, 255, 0.16);
      animation: pulse 4s ease-in-out infinite;
    }

    .core-ring::before,
    .core-ring::after {
      content: "";
      position: absolute;
      border-radius: 50%;
      inset: 25px;
      border: 1px solid rgba(117, 239, 255, 0.28);
    }

    .core-ring::after {
      inset: 52px;
      border-color: rgba(117, 239, 255, 0.14);
    }

    .core-center {
      width: 170px;
      height: 170px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: radial-gradient(circle, rgba(117,239,255,0.18), rgba(11,20,26,0.96) 55%);
      border: 1px solid rgba(117,239,255,0.6);
      box-shadow:
        inset 0 0 28px rgba(117,239,255,0.15),
        0 0 25px rgba(117,239,255,0.12);
      font-size: 2rem;
      letter-spacing: 0.38em;
      color: var(--cyan);
      text-shadow: 0 0 18px rgba(117,239,255,0.7);
    }

    .prompt-bar {
      margin-top: 34px;
      width: min(85%, 660px);
      height: 56px;
      background: rgba(9, 19, 26, 0.8);
      border: 1px solid var(--line);
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 18px;
      box-shadow:
        inset 0 0 20px rgba(117,239,255,0.04),
        0 0 18px rgba(117, 239, 255, 0.08);
    }

    .prompt {
      color: var(--cyan);
      font-size: 20px;
      font-weight: 700;
      text-shadow: 0 0 12px rgba(117,239,255,0.7);
    }

    .prompt-input {
      flex: 1;
      border: none;
      outline: none;
      background: transparent;
      color: var(--white);
      font-size: 15px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .prompt-input::placeholder {
      color: rgba(223, 252, 255, 0.4);
    }

    .radar {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: min(70vw, 700px);
      height: min(70vw, 700px);
      border-radius: 50%;
      border: 1px solid rgba(117,239,255,0.1);
      pointer-events: none;
      opacity: 0.7;
      z-index: 1;
    }

    .radar::before,
    .radar::after {
      content: "";
      position: absolute;
      inset: 10%;
      border-radius: 50%;
      border: 1px solid rgba(117,239,255,0.1);
    }

    .radar::after {
      inset: 20%;
      border-color: rgba(117,239,255,0.08);
    }

    .pulse-ring {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 480px;
      height: 480px;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      border: 1px solid rgba(117,239,255,0.05);
      animation: rotate 12s linear infinite;
      pointer-events: none;
      z-index: 1;
    }

    .pulse-ring::before,
    .pulse-ring::after {
      content: "";
      position: absolute;
      inset: 12%;
      border-radius: 50%;
      border: 1px solid rgba(117,239,255,0.08);
      animation: rotate 18s linear infinite reverse;
    }

    .pulse-ring::after {
      inset: 25%;
      border-color: rgba(117,239,255,0.06);
    }

    @keyframes pulse {
      0%, 100% {
        transform: scale(1);
        box-shadow:
          inset 0 0 40px rgba(117, 239, 255, 0.08),
          0 0 20px rgba(117,239,255,0.1);
      }
      50% {
        transform: scale(1.04);
        box-shadow:
          inset 0 0 60px rgba(117, 239, 255, 0.18),
          0 0 40px rgba(117,239,255,0.22);
      }
    }

    @keyframes rotate {
      from { transform: translate(-50%, -50%) rotate(0deg); }
      to { transform: translate(-50%, -50%) rotate(360deg); }
    }

    @media (max-width: 1100px) {
      .left-panel, .right-panel {
        width: 180px;
      }
      .main {
        width: min(68vw, 620px);
      }
    }

    @media (max-width: 900px) {
      .left-panel, .right-panel {
        position: static;
        width: 100%;
        flex-direction: row;
        justify-content: center;
        flex-wrap: wrap;
      }

      .hud {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }

      .left-panel,
      .right-panel {
        position: absolute;
        top: auto;
        bottom: auto;
        left: 20px;
        right: 20px;
      }

      .left-panel {
        top: 100px;
      }

      .right-panel {
        bottom: 100px;
      }

      .main {
        position: relative;
        left: auto;
        top: auto;
        transform: none;
        width: 100%;
        margin-top: 130px;
        margin-bottom: 140px;
      }
    }
  </style>
</head>
<body>
  <div class="hud">
    <div class="scanlines"></div>
    <div class="pulse-ring"></div>
    <div class="radar"></div>

    <header class="topbar">
      <div class="brand">Stark Industries</div>
      <div class="status">
        <span class="dot"></span>
        <span id="statusText">System Online</span>
      </div>
    </header>

    <aside class="left-panel">
      <div class="module active">Home</div>
      <div class="module">Security</div>
      <div class="module">Suit</div>
      <div class="module">Research</div>
    </aside>

    <main class="main">
      <div class="core-ring">
        <div class="core-center">JARVIS</div>
      </div>

      <div class="prompt-bar">
        <span class="prompt">></span>
        <input
          class="prompt-input"
          type="text"
          value="Good morning, Tony."
          aria-label="Command"
          readonly
        />
      </div>
    </main>

    <aside class="right-panel">
      <div class="card">
        <div class="label">Power</div>
        <div class="value">94.8%</div>
      </div>
      <div class="card">
        <div class="label">Weather</div>
        <div class="value">21°C</div>
      </div>
      <div class="card">
        <div class="label">Time</div>
        <div class="value" id="clock">00:00:00</div>
      </div>
    </aside>

    <footer class="bottombar">
      <div>Microphone Active</div>
      <div>Voice Ready</div>
      <div id="bottomTime">00:00:00</div>
    </footer>
  </div>

  <script>
    function updateClock() {
      const now = new Date();
      const time = now.toLocaleTimeString([], { hour12: false });
      document.getElementById("clock").textContent = time;
      document.getElementById("bottomTime").textContent = time;
    }

    setInterval(updateClock, 1000);
    updateClock();
  </script>
</body>
</html>
